# This is a basic workflow to help you get started with Actions       

name: CI

# Controls when the workflow will run 
on:
  # Triggers the workflow on push or pull request events but only for the $default-branch branch
  push:
    branches: [ k3-master ]
  pull_request:
    branches: [ k3-master ]

  # Allows you to run this workflow manually from the Actions tab 
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build" 
  build:
    # The type of runner that the job will run on
    runs-on: self-hosted
    env:
      http_proxy: "http://10.10.3.72:7890"
      https_proxy: "http://10.10.3.72:7890"
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout k3-master
        uses: actions/checkout@v4
        with:
          ref: k3-master
          path: k3-linux
      # Runs a set of commands using the runners shell
      - name: build-linux
        id: build-linux
        run: |
          sudo docker ps   
          pwd
          sudo docker run \
            --rm \
            --name build-linux-$GITHUB_RUN_ID \
            --privileged=true \
            -v /home/gitlab-runner/actions-runner/_work/DC-linux/DC-linux/k3-linux:/k3 \
            harbor.spacemit.com/bianbu/k3-bsp-builder:latest \
            /bin/bash -c "  
              cd /k3
              git config --global --add safe.directory /k3
              export TOOLCHAIN=/opt/spacemit-toolchain-linux-glibc-x86_64-v1.2.2
              export PATH=$TOOLCHAIN/bin:$PATH
              export ARCH=riscv
              export CROSS_COMPILE=riscv64-linux-gnu-
              apt update
              apt install -y gcc-riscv64-linux-gnu
              make defconfig
              make -j$(nproc) bindeb-pkg
            "
      - name: send-mail
        if: ${{ failure() && steps.build-linux.conclusion == 'failure' }}
        # if: ${{ success() && steps.build-linux.conclusion == 'success' }}
        env: 
             mail: ${{ secrets.SEND_MAIL }}
        run: |
          echo $mail
          echo "CI build code failure ! $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/$JOB_ID" | mail -s "build code" $mail
        
      - name: upload
        env: 
             passd: ${{ secrets.SEND_MAIL }}
        run: |
          cd /home/gitlab-runner/actions-runner/_work/DC-linux/DC-linux/ 
          sudo rm  -rf k3-linux
          # zip -r -y modules.zip  modules
          # curl -uadmin:${{secrets.ADMIN_PASS}} -T  modules.zip ${{secrets.JFROG_PATH}}/modules.zip
          # cd /home/gitlab-runner/actions-runner/_work/DC-linux/DC-linux/arch/riscv
          # zip -r -y boot.zip boot
          # curl -uadmin:${{secrets.ADMIN_PASS}} -T  boot.zip ${{secrets.JFROG_PATH}}/boot.zip


